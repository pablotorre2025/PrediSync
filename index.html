      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Lora:wght@400;600;700&family=Playfair+Display:wght@500;700&family=EB+Garamond:wght@400;600&family=Crimson+Pro:wght@400;600&family=Source+Serif+4:wght@400;600&family=Work+Sans:wght@400;600&family=Nunito:wght@400;600&family=Raleway:wght@400;600&family=Open+Sans:wght@400;600&family=Libre+Baskerville:wght@400;700&family=Spectral:wght@400;600&family=DM+Serif+Display&family=PT+Serif:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Sermon Maker Pro</title>
    <!-- Auto-clear cache when a new app version is deployed -->
    <script>
      (function(){
        try {
          var V = '1.0.1';
          var k = '__smp_v';
          if (localStorage.getItem(k) !== V) {
            localStorage.setItem(k, V);
            if ('caches' in window) {
              caches.keys().then(function(ks) {
                return Promise.all(ks.map(function(c) { return caches.delete(c); }));
              }).then(function() { location.reload(); });
              return;
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
