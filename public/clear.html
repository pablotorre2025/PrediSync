<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limpiando caché…</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a;color:#fff;text-align:center;padding:24px;gap:16px;}
    h2{margin:0;font-size:22px;}
    p{opacity:0.6;font-size:14px;margin:0;max-width:280px;}
    .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Limpiando caché…</h2>
  <p>Desregistrando Service Worker y limpiando todos los archivos en caché. Serás redirigido en unos segundos.</p>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function(r){ return r.unregister(); }));
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function(k){ return caches.delete(k); }));
        }
        localStorage.removeItem('__smp_v');
      } catch(e) {}
      window.location.replace('/?refresh=' + Date.now());
    })();
  </script>
</body>
</html>
